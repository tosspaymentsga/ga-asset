<style>
/* =================================================================
   자산실사 — 디자인 토큰
   흰색 기반 / Navy-Black 타이포 / Primary Blue 최소 / 그림자·그라디언트 미사용
   ================================================================= */
:root {
  --ink:        #16181D;
  --ink-2:      #4E5561;
  --ink-3:      #8B919B;
  --line:       #ECEEF2;
  --line-2:     #DFE3E9;
  --bg:         #FFFFFF;
  --bg-soft:    #F7F8FA;

  --blue:       #3182F6;
  --blue-dark:  #1B64DA;
  --blue-soft:  #EFF5FF;

  --green:      #0F9D58;
  --green-soft: #EAF7EF;

  --orange:     #C2670B;
  --orange-soft:#FFF5E6;

  --red:        #D93A3F;
  --red-soft:   #FDEFEF;

  --radius:     14px;
  --radius-sm:  10px;

  --safe-b:     env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
    Pretendard, "Noto Sans KR", "Malgun Gothic", "맑은 고딕", sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  /* 한국어는 어절 단위로 줄바꿈하고, 넘칠 때만 단어를 끊는다 */
  word-break: keep-all;
  overflow-wrap: break-word;
}

button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: 15px; }
a { color: inherit; }

/* ---------------- 레이아웃 ---------------- */
.wrap {
  max-width: 480px;
  margin: 0 auto;
  padding: 0 20px;
}
.wrap-wide {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 24px;
}
.screen { padding-bottom: 24px; }
/* Sticky CTA 가 있는 화면의 하단 여백 */
.has-cta { padding-bottom: calc(96px + var(--safe-b)); }

.stack > * + * { margin-top: 10px; }
.stack-lg > * + * { margin-top: 16px; }

/* ---------------- 헤더 ---------------- */
.appbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(255,255,255,.94);
  backdrop-filter: saturate(180%) blur(8px);
  border-bottom: 1px solid var(--line);
}
.appbar-inner {
  max-width: 480px;
  margin: 0 auto;
  padding: 0 12px;
  height: 52px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.appbar-inner.wide { max-width: 1280px; padding: 0 16px; }
.appbar-title {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -.2px;
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.icon-btn {
  width: 40px; height: 40px;
  display: inline-flex; align-items: center; justify-content: center;
  border: 0; background: transparent; border-radius: 10px;
  color: var(--ink); font-size: 18px; line-height: 1;
  flex: 0 0 auto;
}
.icon-btn:active { background: var(--bg-soft); }

/* ---------------- 타이포 ---------------- */
.page-title {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -.4px;
  margin: 20px 0 6px;
}
.page-desc { color: var(--ink-2); font-size: 14px; margin: 0 0 18px; }
.section-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-3);
  margin: 22px 0 8px;
  letter-spacing: -.1px;
}
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.tiny  { font-size: 12px; }
.strong { font-weight: 600; }
.nowrap { white-space: nowrap; }

/* ---------------- 진행률 ---------------- */
.progress-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  background: var(--bg);
}
.progress-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}
.progress-label { font-size: 13px; color: var(--ink-2); font-weight: 500; }
.progress-count { font-size: 15px; font-weight: 700; letter-spacing: -.2px; }
.progress-count em { font-style: normal; color: var(--blue); }
.bar {
  height: 6px;
  background: var(--line);
  border-radius: 99px;
  overflow: hidden;
}
.bar > i {
  display: block;
  height: 100%;
  background: var(--blue);
  border-radius: 99px;
  transition: width .28s ease;
}
.bar.is-done > i { background: var(--green); }

/* ---------------- 자산 카드 ---------------- */
.asset-card {
  width: 100%;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--bg);
}
.asset-card:active { background: var(--bg-soft); }
.asset-main { flex: 1; min-width: 0; }
.asset-name {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -.2px;
  margin-bottom: 3px;
}
.asset-meta {
  font-size: 12.5px;
  color: var(--ink-3);
  display: flex;
  flex-wrap: wrap;
  gap: 4px 10px;
}
.asset-side { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; }
.chev { color: var(--line-2); font-size: 15px; }

/* ---------------- 상태 pill ---------------- */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  font-weight: 600;
  padding: 4px 9px;
  border-radius: 99px;
  white-space: nowrap;
  letter-spacing: -.1px;
}
.pill-idle  { background: var(--bg-soft); color: var(--ink-3); }
.pill-done  { background: var(--green-soft); color: var(--green); }
.pill-photo { background: var(--blue-soft); color: var(--blue-dark); }
.pill-warn  { background: var(--orange-soft); color: var(--orange); }

/* ---------------- 버튼 ---------------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 100%;
  min-height: 50px;
  padding: 12px 16px;
  border-radius: 12px;
  border: 1px solid transparent;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -.2px;
  background: var(--bg-soft);
  color: var(--ink);
}
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--blue); color: #fff; }
.btn-primary:active { background: var(--blue-dark); }
.btn-line { background: #fff; border-color: var(--line-2); color: var(--ink); }
.btn-line:active { background: var(--bg-soft); }
.btn-quiet { background: transparent; color: var(--ink-2); min-height: 44px; }
/* 3순위 동작 (예: 보유하지 않음 신고) — 링크에 가까운 위계 */
.btn-text {
  border: 0;
  background: transparent;
  color: var(--ink-3);
  font-size: 14px;
  font-weight: 500;
  padding: 12px 8px;
  min-height: 44px;
  text-decoration: underline;
  text-underline-offset: 3px;
  text-decoration-color: var(--line-2);
}
.btn-text:active { color: var(--ink); }
.btn-danger { background: #fff; border-color: var(--line-2); color: var(--red); }
.btn-sm { min-height: 38px; padding: 8px 12px; font-size: 13px; width: auto; }
.btn-row { display: flex; gap: 8px; }
.btn-row > .btn { flex: 1; }

/* ---------------- Sticky CTA ---------------- */
.cta {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 30;
  background: linear-gradient(to top, #fff 72%, rgba(255,255,255,0));
  padding: 12px 20px calc(12px + var(--safe-b));
}
.cta-inner { max-width: 480px; margin: 0 auto; }

/* ---------------- 폼 ---------------- */
.field { display: block; margin-top: 14px; }
.field > span {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-2);
  margin-bottom: 6px;
}
.input, .textarea, .select {
  width: 100%;
  border: 1px solid var(--line-2);
  border-radius: 10px;
  padding: 11px 12px;
  background: #fff;
  color: var(--ink);
  outline: none;
}
.input:focus, .textarea:focus, .select:focus { border-color: var(--blue); }
.textarea { min-height: 84px; resize: vertical; }

.radio-list { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.radio-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 14px;
  border-bottom: 1px solid var(--line);
  font-size: 15px;
}
.radio-item:last-child { border-bottom: 0; }
.radio-item input { width: 18px; height: 18px; accent-color: var(--blue); flex: 0 0 auto; }

/* ---------------- 안내 박스 ---------------- */
.notice {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  font-size: 13.5px;
  color: var(--ink-2);
  background: var(--bg-soft);
}
.notice-warn { background: var(--orange-soft); border-color: #F6E3C6; color: #8A4B03; }
.notice-error { background: var(--red-soft); border-color: #F6D5D6; color: #9B2226; }

/* ---------------- 결과 화면 ---------------- */
.result { text-align: center; padding: 28px 0 8px; }
.result-mark {
  width: 56px; height: 56px;
  border-radius: 50%;
  margin: 0 auto 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; font-weight: 700;
}
.mark-ok { background: var(--green-soft); color: var(--green); }
.mark-warn { background: var(--orange-soft); color: var(--orange); }
.mark-info { background: var(--blue-soft); color: var(--blue-dark); }
.result-title { font-size: 19px; font-weight: 700; letter-spacing: -.3px; margin-bottom: 6px; }
.result-desc { color: var(--ink-2); font-size: 14px; }

.summary {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  margin-top: 20px;
}
.summary-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
}
.summary-row:last-child { border-bottom: 0; }
.summary-row > span:first-child { color: var(--ink-2); }
.summary-row > span:last-child { font-weight: 600; }

/* ---------------- QR 스캐너 ---------------- */
.scanner {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  max-height: 58vh;
  background: #0E1013;
  border-radius: var(--radius);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.scanner video {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}
.scanner-frame {
  position: absolute;
  inset: 18%;
  border: 2px solid rgba(255,255,255,.9);
  border-radius: 16px;
  pointer-events: none;
}
.scanner-hint {
  position: absolute;
  left: 0; right: 0; bottom: 12px;
  text-align: center;
  color: #fff;
  font-size: 13px;
  text-shadow: 0 1px 2px rgba(0,0,0,.5);
  padding: 0 16px;
}
.scanner-fallback {
  color: #C9CDD3;
  font-size: 14px;
  text-align: center;
  padding: 24px 20px;
}

/* ---------------- 사진 미리보기 ---------------- */
.photo-preview {
  width: 100%;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  display: block;
  background: var(--bg-soft);
}
.photo-guide {
  border: 1px dashed var(--line-2);
  border-radius: var(--radius);
  padding: 22px 16px;
  text-align: center;
  color: var(--ink-2);
  font-size: 14px;
  background: var(--bg-soft);
}

/* ---------------- 토스트 ---------------- */
.toast-host {
  position: fixed;
  left: 50%;
  bottom: calc(88px + var(--safe-b));
  transform: translateX(-50%);
  z-index: 60;
  width: calc(100% - 40px);
  max-width: 420px;
  pointer-events: none;
}
.toast {
  background: #16181D;
  color: #fff;
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 13.5px;
  line-height: 1.45;
  opacity: 0;
  transform: translateY(6px);
  transition: opacity .18s ease, transform .18s ease;
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast-error { background: #8E2226; }

/* ---------------- 로딩 ---------------- */
.spinner {
  width: 18px; height: 18px;
  border: 2px solid rgba(255,255,255,.35);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
.spinner-dark { border-color: var(--line-2); border-top-color: var(--ink-3); }
@keyframes spin { to { transform: rotate(360deg); } }
.center-box { padding: 64px 20px; text-align: center; color: var(--ink-3); }
.center-box .spinner { margin: 0 auto 12px; }

/* ---------------- 관리자 ---------------- */
.admin-body { background: var(--bg-soft); min-height: 100vh; }
.tabs {
  display: flex;
  gap: 2px;
  border-bottom: 1px solid var(--line);
  background: #fff;
  overflow-x: auto;
}
.tab {
  border: 0;
  background: transparent;
  padding: 13px 14px;
  font-size: 14px;
  font-weight: 600;
  color: var(--ink-3);
  border-bottom: 2px solid transparent;
  white-space: nowrap;
}
.tab.active { color: var(--ink); border-bottom-color: var(--ink); }

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.kpi {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  min-width: 0;
}
.kpi-label { font-size: 12.5px; color: var(--ink-3); margin-bottom: 6px; }
.kpi-value { font-size: 24px; font-weight: 700; letter-spacing: -.6px; }
.kpi-value.green { color: var(--green); }
.kpi-value.orange { color: var(--orange); }
.kpi-value.blue { color: var(--blue); }
.kpi-sub { font-size: 12px; color: var(--ink-3); margin-top: 4px; }

.panel {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
}
.panel + .panel { margin-top: 14px; }
.panel-title { font-size: 14px; font-weight: 700; margin: 0 0 12px; }

.filters {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 8px;
}
.table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.grid {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  min-width: 860px;
}
table.grid th, table.grid td {
  text-align: left;
  padding: 10px 12px;
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
  /* 자산번호 · Tag · 일시 같은 값이 중간에서 잘리지 않도록 한다 */
  white-space: nowrap;
}
/* 메모처럼 길어질 수 있는 칸만 줄바꿈을 허용한다 */
table.grid td.cell-wrap {
  white-space: normal;
  min-width: 180px;
  max-width: 320px;
}
table.grid th {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-3);
  background: var(--bg-soft);
  position: sticky;
  top: 0;
}
table.grid tbody tr:hover { background: #FCFCFD; }
.cell-strong { font-weight: 600; }
.cell-muted { color: var(--ink-3); }

.recon-list { display: grid; grid-template-columns: 1fr; gap: 10px; }
.recon-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  background: #fff;
}
.recon-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}
.recon-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.recon-actions .btn { width: auto; }
.hint-box {
  margin-top: 10px;
  background: var(--bg-soft);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  font-size: 12.5px;
  color: var(--ink-2);
}
.dept-row {
  display: grid;
  grid-template-columns: minmax(0,1fr) 64px 64px 56px;
  gap: 8px;
  align-items: center;
  padding: 9px 0;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
}
.dept-row:last-child { border-bottom: 0; }
.dept-row > span:not(:first-child) { text-align: right; }
.dept-head { color: var(--ink-3); font-size: 12px; font-weight: 600; }

/* ---------------- 데모 배너 ---------------- */
.demo-bar {
  background: #FFF9E6;
  border-bottom: 1px solid #F3E4B8;
  color: #7A5B00;
  font-size: 12.5px;
  padding: 7px 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
}
.demo-bar select {
  border: 1px solid #E3D091;
  background: #fff;
  border-radius: 8px;
  padding: 4px 8px;
  font-size: 12.5px;
  max-width: 140px;
}
.demo-bar button {
  border: 1px solid #E3D091;
  background: #fff;
  border-radius: 8px;
  padding: 4px 9px;
  font-size: 12.5px;
  color: #7A5B00;
}

/* ---------------- 데스크톱 ---------------- */
@media (min-width: 768px) {
  body { font-size: 15px; }
  .kpi-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .kpi-value { font-size: 27px; }
  .page-title { font-size: 24px; }
  .cta { position: static; padding: 16px 0 0; background: none; }
  .cta-inner { max-width: 480px; }
  .has-cta { padding-bottom: 40px; }
  table.grid { min-width: 0; }
}

@media (min-width: 1024px) {
  .admin-two-col {
    display: grid;
    grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
    gap: 14px;
    align-items: start;
  }
  .panel + .panel.in-col { margin-top: 0; }
}

@media (min-width: 1200px) {
  /* 확인 필요 항목이 많을 때 스크롤을 줄인다 */
  .recon-list { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
}
</style>
